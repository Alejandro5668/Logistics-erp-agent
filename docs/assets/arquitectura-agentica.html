<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agente ERP · Arquitectura</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Agente ERP</p>
    <h1>Conciliación ERP/logística — flujo del agente</h1>

    <svg viewBox="0 0 1040 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="erp-agent-title erp-agent-desc">
      <title id="erp-agent-title">Arquitectura del agente de conciliación ERP</title>
      <desc id="erp-agent-desc">Diagrama de arquitectura mostrando un orquestador ReAct que enruta entre herramientas de datos ERP, cálculo de discrepancia fiscal y RAG normativo, pasa por un guardrail de seguridad, y aprueba un ajuste automático en el ERP o escala a revisión humana.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-both" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zone: Tools (drawn before arrows and nodes) -->
      <rect x="224" y="348" width="552" height="112" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="240" y="352" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="270" y="361" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">HERRAMIENTAS</text>

      <!-- Arrows (behind boxes) -->
      <!-- Usuario -> Orquestador -->
      <line x1="180" y1="224" x2="240" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="187" y="204" width="46" height="12" rx="2" fill="#f5f5f5"/>
      <text x="210" y="213" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PROMPT</text>

      <!-- Orquestador <-> Memoria (bidirectional state) -->
      <line x1="320" y1="188" x2="320" y2="120" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-both)" marker-start="url(#arrow-both)"/>
      <rect x="326" y="148" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="352" y="157" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ESTADO</text>

      <!-- Orquestador -> Tool RAG (bends first, closest to source) -->
      <path d="M 360,260 V 272 Q 360,280 368,280 H 668 Q 676,280 676,288 V 380"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Orquestador -> Tool Tax -->
      <path d="M 320,260 V 312 Q 320,320 328,320 H 484 Q 492,320 492,328 V 380"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Orquestador -> Tool ERP -->
      <path d="M 280,260 V 332 Q 280,340 288,340 H 308 Q 316,340 316,348 V 380"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Orquestador -> Guardrail -->
      <line x1="400" y1="224" x2="560" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="447" y="204" width="66" height="12" rx="2" fill="#f5f5f5"/>
      <text x="480" y="213" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RESULTADO</text>

      <!-- Guardrail -> Ajuste ERP (approved path) -->
      <path d="M 728,212 H 788 Q 796,212 796,204 V 140 Q 796,132 804,132 H 864"
            fill="none" stroke="#eb6c36" stroke-width="1.3" marker-end="url(#arrow)"/>
      <rect x="768" y="160" width="66" height="12" rx="2" fill="#f5f5f5"/>
      <text x="801" y="169" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">APROBADO</text>

      <!-- Guardrail -> Notificar humano (escalation / blocked path) -->
      <path d="M 728,236 H 788 Q 796,236 796,244 V 324 Q 796,332 804,332 H 864"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="760" y="266" width="82" height="12" rx="2" fill="#f5f5f5"/>
      <text x="801" y="275" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ESCALA/BLOQUEA</text>

      <!-- Node: Usuario (Input/User) -->
      <rect x="40" y="192" width="140" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="192" width="140" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="48" y="200" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="62" y="209" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USR</text>
      <text x="110" y="230" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Usuario</text>
      <text x="110" y="246" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">lenguaje natural</text>

      <!-- Node: Memoria de sesión (Store) -->
      <rect x="248" y="64" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="248" y="64" width="144" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="256" y="72" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="270" y="81" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MEM</text>
      <text x="320" y="100" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Memoria de sesión</text>
      <text x="320" y="114" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">historial + resultados tools</text>

      <!-- Node: Orquestador ReAct (FOCAL) -->
      <rect x="240" y="188" width="160" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="240" y="188" width="160" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="248" y="196" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="262" y="205" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AGT</text>
      <text x="320" y="232" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Orquestador ReAct</text>
      <text x="320" y="248" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">LangGraph · tool routing</text>

      <!-- Node: Tool RAG -->
      <rect x="592" y="380" width="168" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="592" y="380" width="168" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="600" y="388" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="614" y="397" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RAG</text>
      <text x="676" y="416" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">RAG normativo</text>
      <text x="676" y="432" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">año 2024 · metadata filter</text>

      <!-- Node: Tool Tax -->
      <rect x="416" y="380" width="152" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="416" y="380" width="152" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="424" y="388" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="440" y="397" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CALC</text>
      <text x="492" y="416" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Discrepancia fiscal</text>
      <text x="492" y="432" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">calculate_tax_discrepancy()</text>

      <!-- Node: Tool ERP -->
      <rect x="240" y="380" width="152" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="240" y="380" width="152" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="248" y="388" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="262" y="397" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SQL</text>
      <text x="316" y="416" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ERP Data (mock)</text>
      <text x="316" y="432" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">get_erp_data(order_id)</text>

      <!-- Node: Guardrail (Security/Boundary, FOCAL 2/2) -->
      <rect x="560" y="188" width="168" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="560" y="188" width="168" height="72" rx="6" fill="rgba(235,108,54,0.05)" stroke="#eb6c36" stroke-width="1" stroke-dasharray="4,4"/>
      <rect x="568" y="196" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
      <text x="582" y="205" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SEC</text>
      <text x="644" y="232" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Guardrail seguridad</text>
      <text x="644" y="248" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">PII/rol · prompt injection</text>

      <!-- Node: Ajuste ERP automático (approved outcome) -->
      <rect x="864" y="100" width="152" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="864" y="100" width="152" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="872" y="108" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="886" y="117" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ERP</text>
      <text x="940" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ajuste automático</text>
      <text x="940" y="152" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">asiento en el ERP</text>

      <!-- Node: Notificar humano (escalation outcome, Optional/Async) -->
      <rect x="864" y="300" width="152" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="864" y="300" width="152" height="64" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="872" y="308" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="886" y="317" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HUM</text>
      <text x="940" y="336" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Notificar humano</text>
      <text x="940" y="352" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">revisión manual</text>

      <!-- Legend strip -->
      <line x1="40" y1="520" x2="1000" y2="520" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="536" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="552" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="60" y="560" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Input</text>

      <rect x="150" y="552" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="170" y="560" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Store (memoria)</text>

      <rect x="310" y="552" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="330" y="560" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal / decisión</text>

      <rect x="470" y="552" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="490" y="560" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Tool / paso</text>

      <rect x="600" y="552" width="14" height="10" rx="2" fill="rgba(235,108,54,0.05)" stroke="#eb6c36" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="620" y="560" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Guardrail (boundary)</text>

      <rect x="790" y="552" width="14" height="10" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="810" y="560" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Escalación / opcional</text>
    </svg>
  </div>
</body>
</html>
