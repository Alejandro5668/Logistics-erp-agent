<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agente ERP · Arquitectura</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1080px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 820px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Agente ERP</p>
    <h1>Conciliación ERP/logística — flujo del agente</h1>

    <svg viewBox="0 0 940 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="erp-agent-title erp-agent-desc">
      <title id="erp-agent-title">Arquitectura del agente de conciliación ERP</title>
      <desc id="erp-agent-desc">Diagrama de arquitectura mostrando un orquestador ReAct que consulta herramientas de datos, pasa por un guardrail de seguridad, y aprueba un ajuste automático en el ERP o escala a revisión humana.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-both" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Arrows first (behind boxes) -->
      <!-- Usuario -> Orquestador -->
      <line x1="180" y1="232" x2="240" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="187" y="212" width="46" height="12" rx="2" fill="#f5f5f5"/>
      <text x="210" y="221" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PROMPT</text>

      <!-- Orquestador <-> Memoria (bidirectional state) -->
      <line x1="320" y1="196" x2="320" y2="128" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-both)" marker-start="url(#arrow-both)"/>
      <rect x="326" y="154" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="352" y="163" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ESTADO</text>

      <!-- Orquestador -> Herramientas (loop: agent calls tools, reads results back) -->
      <line x1="320" y1="268" x2="320" y2="336" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-both)" marker-start="url(#arrow-both)"/>
      <rect x="326" y="294" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="356" y="303" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TOOL CALL</text>

      <!-- Orquestador -> Guardrail -->
      <line x1="400" y1="232" x2="580" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="447" y="212" width="66" height="12" rx="2" fill="#f5f5f5"/>
      <text x="480" y="221" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RESPUESTA</text>

      <!-- Guardrail -> Ajuste ERP (approved path) -->
      <path d="M 748,216 H 788 Q 796,216 796,208 V 156 Q 796,148 804,148 H 824"
            fill="none" stroke="#eb6c36" stroke-width="1.3" marker-end="url(#arrow)"/>
      <rect x="753" y="176" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="783" y="185" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">APROBADO</text>

      <!-- Guardrail -> Notificar humano (escalation / blocked path) -->
      <path d="M 748,248 H 788 Q 796,248 796,256 V 308 Q 796,316 804,316 H 824"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="761" y="278" width="50" height="12" rx="2" fill="#f5f5f5"/>
      <text x="786" y="287" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ESCALA</text>

      <!-- Node: Usuario (Input/User) -->
      <rect x="40" y="200" width="140" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="200" width="140" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="48" y="208" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="62" y="217" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USR</text>
      <text x="110" y="238" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Usuario</text>
      <text x="110" y="254" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">lenguaje natural</text>

      <!-- Node: Memoria de sesión (Store) -->
      <rect x="240" y="72" width="160" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="240" y="72" width="160" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="248" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="262" y="89" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MEM</text>
      <text x="320" y="108" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Memoria de sesión</text>
      <text x="320" y="122" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">historial + resultados</text>

      <!-- Node: Orquestador ReAct (FOCAL) -->
      <rect x="240" y="196" width="160" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="240" y="196" width="160" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="248" y="204" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="262" y="213" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AGT</text>
      <text x="320" y="240" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Orquestador ReAct</text>
      <text x="320" y="256" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">create_agent (LangChain)</text>

      <!-- Node: Herramientas (grouped: ERP data, discrepancia fiscal, RAG normativo) -->
      <rect x="240" y="336" width="160" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="240" y="336" width="160" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="248" y="344" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="264" y="353" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TOOLS</text>
      <text x="320" y="380" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Herramientas de datos</text>
      <text x="320" y="396" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ERP · fiscal · normativa</text>

      <!-- Node: Guardrail (Security/Boundary, FOCAL 2/2) -->
      <rect x="580" y="196" width="168" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="580" y="196" width="168" height="72" rx="6" fill="rgba(235,108,54,0.05)" stroke="#eb6c36" stroke-width="1" stroke-dasharray="4,4"/>
      <rect x="588" y="204" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
      <text x="602" y="213" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SEC</text>
      <text x="664" y="240" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Guardrail seguridad</text>
      <text x="664" y="256" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">PII/rol · prompt injection</text>

      <!-- Node: Ajuste ERP automático (approved outcome) -->
      <rect x="824" y="116" width="112" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="824" y="116" width="112" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="832" y="124" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="846" y="133" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ERP</text>
      <text x="880" y="152" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ajuste</text>
      <text x="880" y="168" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">automático</text>

      <!-- Node: Notificar humano (escalation outcome, Optional/Async) -->
      <rect x="824" y="284" width="112" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="824" y="284" width="112" height="64" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="832" y="292" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="846" y="301" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HUM</text>
      <text x="880" y="320" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Notificar</text>
      <text x="880" y="336" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">humano</text>

      <!-- Legend strip -->
      <line x1="40" y1="418" x2="900" y2="418" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="434" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="450" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="60" y="458" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal / decisión</text>

      <rect x="210" y="450" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="230" y="458" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Tool / paso</text>

      <rect x="360" y="450" width="14" height="10" rx="2" fill="rgba(235,108,54,0.05)" stroke="#eb6c36" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="380" y="458" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Guardrail (boundary)</text>

      <rect x="560" y="450" width="14" height="10" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="580" y="458" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Escalación / opcional</text>
    </svg>
  </div>
</body>
</html>
